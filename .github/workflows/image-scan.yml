name: Image scan

# Once a week, the newest published image (ghcr.io/kirianm/vihko, the tag of
# the newest v* release, release candidates included) is scanned for known
# vulnerabilities with a fix available, HIGH or CRITICAL. What it finds goes
# to the repository's code scanning alerts (category `image`), where each one
# is triaged like any other: a flaw that reaches vihko is followed by a patch
# release, anything else goes out with the next release, whose own scan
# (release.yml, job smoke) won't publish an image that still has it. An alert
# closes by itself once a scan no longer finds it. Published tags never
# change.
#
# The scanner is Trivy's own image, pinned by digest (a tag can be moved to
# another image, a digest can't), with its release in a trailing comment.
# Dependabot doesn't see an image run from a step: update both by hand, here
# and in release.yml, to a release at least a week old.
#
# One short job a week: a few minutes of Actions.
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays, 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-scan
  cancel-in-progress: false

env:
  TRIVY: aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 # 0.74.0

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write # upload the findings to code scanning
    steps:
      - name: The newest published version
        id: version
        env:
          REPO: ${{ github.server_url }}/${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tags, newest first (a release candidate before its release: versionsort.suffix); the repository may be private.
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          tag=$(git -c "http.extraHeader=Authorization: basic $auth" -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname "$REPO" 'v*' | head -n 1 | sed 's|.*refs/tags/v||')
          if [ -z "$tag" ]; then echo "no release yet"; exit 1; fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vihko:$tag" >> "$GITHUB_OUTPUT"
          echo "Scanning ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vihko:$tag"
      - name: Sign in to the registry (the package may be private)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Scan
        env:
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          docker pull --quiet "$IMAGE"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" "$TRIVY" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --no-progress --skip-version-check \
            --format json --output /work/report.json "$IMAGE"
          # The log keeps a table to read; code scanning takes SARIF.
          docker run --rm -v "$PWD:/work" "$TRIVY" convert --format table /work/report.json
          docker run --rm -v "$PWD:/work" "$TRIVY" convert --format sarif --output /work/report.sarif /work/report.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo # where upload-sarif looks for the commit; the scan's files stay out of it
          persist-credentials: false
      - name: The findings, to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: report.sarif
          category: image
          checkout_path: repo
