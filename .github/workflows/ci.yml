name: CI

# The full CI runs locally (npm run ci), which posts its result to the commit as
# the ci/local status: GitHub-hosted minutes are limited. Here it runs only for
# Dependabot's pull requests, which nobody runs locally, and by hand if needed.
# scripts/ci.ts runs these same four jobs, steps and timeout-minutes: a change
# to one goes to the other too (see CONTRIBUTING.md, CI).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chromium and its libraries
        run: npx -w @vihko/web playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e -w @vihko/web
      - name: Browser acceptance (generated 1,000-note vault)
        run: npm run acceptance:ui -w @vihko/web
      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7

  acceptance:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: M1 acceptance (generated 1,000-note vault)
        run: npm run acceptance
        env:
          ACCEPTANCE_DOCKER: '0' # the docker job runs that part against the image it builds

  docker:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build the image
        run: docker build -t vihko:ci .
      - name: Starts and answers the healthcheck
        run: |
          docker run -d --name vihko -p 8080:8080 vihko:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          docker logs vihko
          curl -fs http://127.0.0.1:8080/api/health
      - name: Serves the UI
        run: curl -fs http://127.0.0.1:8080/ | grep -q 'id="root"'
      - run: npm ci
      - name: Acceptance with docker compose (startup, search, kill -9)
        run: node --test --test-force-exit packages/server/test/acceptance/docker.acceptance.ts
        env:
          ACCEPTANCE_IMAGE: vihko:ci
