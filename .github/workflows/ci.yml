name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Chromium and its libraries
        run: npx -w @thoth/web playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e -w @thoth/web
      - name: Report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/web/playwright-report
            packages/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t thoth:ci .
      - name: Starts and answers the healthcheck
        run: |
          docker run -d --name thoth -p 8080:8080 thoth:ci
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8080/api/health && break
            sleep 1
          done
          docker logs thoth
          curl -fs http://127.0.0.1:8080/api/health
      - name: Serves the UI
        run: curl -fs http://127.0.0.1:8080/ | grep -q 'id="root"'
