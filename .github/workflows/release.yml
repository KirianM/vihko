name: Release

# Pushing a tag v* (DEVELOPMENT.md, Releasing) publishes that version:
#
#   v1.2.3       image ghcr.io/kirianm/vihko:1.2.3, :1.2, :1 and :latest; a Release
#   v1.0.0-rc.1  image ghcr.io/kirianm/vihko:1.0.0-rc.1 only; a pre-release
#
# for linux/amd64 and linux/arm64 (arm64 emulated with QEMU, the slow part).
# A moving tag (1.2, 1, latest) only goes forward: a fix for an older line
# doesn't take it back (scripts/release.ts, tested in test/release.test.ts).
# The Release's text is the version's CHANGELOG.md section.
#
# Nothing is pushed until the check job passes: the tag matches the root
# package.json's version and CHANGELOG.md has a section for it. The Release is
# made once the image is in the registry.
#
# Every action is pinned to a full commit SHA, with its release in a trailing
# comment, as in ci.yml; Dependabot (.github/dependabot.yml, github-actions)
# proposes the new SHA and comment.
#
# Nothing here reads GitHub's Actions cache (setup-node's npm cache, the
# emulator's image): any workflow run on main can write that cache, and
# what builds and publishes the image trusts only the tag's code and the
# registries.
on:
  push:
    tags: ['v*']

permissions: {}

# One release at a time, so two tags pushed together don't race for 1 or
# latest. GitHub keeps only one run waiting: push tags one at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      latest: ${{ steps.check.outputs.latest }}
      tags: ${{ steps.check.outputs.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the earlier tags: a moving tag never goes back
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The tag matches package.json, and CHANGELOG.md has its section
        id: check
        run: node scripts/release.ts "$GITHUB_REF_NAME"

  image:
    needs: check
    runs-on: ubuntu-latest
    # The maintainer approves each publication (the environment's required
    # reviewer): a tag alone, or a leaked token, doesn't publish an image.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    env:
      # What the image says about itself, as labels (docker inspect) and as
      # annotations (GHCR shows the index's). metadata-action adds source, url,
      # revision and created; these replace what it would take from the
      # repository (its description, and "AGPL-3.0" for the licence).
      OCI: |
        org.opencontainers.image.title=vihko
        org.opencontainers.image.description=A self-hosted, open source notes system over plain Markdown files, with its own web UI, multiple users, live collaboration, and a server-side index you can query from the UI and, optionally, from an API and an MCP server.
        org.opencontainers.image.licenses=AGPL-3.0-only
        org.opencontainers.image.version=${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          cache-image: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/kirianm/vihko
          flavor: latest=false # scripts/release.ts decides it, in the tags
          tags: ${{ needs.check.outputs.tags }}
          labels: ${{ env.OCI }}
          annotations: ${{ env.OCI }}
      # No build cache: GitHub's is per ref, and each release is a new tag.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  release:
    needs: [check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The version's CHANGELOG.md section
        run: node scripts/release.ts "$GITHUB_REF_NAME" --notes "$RUNNER_TEMP/notes.md"
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "vihko $VERSION" --notes-file "$RUNNER_TEMP/notes.md" "--latest=$LATEST")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}"
