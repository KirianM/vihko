# Weekly version checks: npm, GitHub Actions and the Docker base image.
#
# Node major upgrades (runtime, image and @types/node) are NOT proposed by
# Dependabot: they are decided by hand following the LTS schedule, because odd
# Node versions have no LTS and are not used.
#
# A new version is proposed a week after it is published (cooldown), so a
# compromised release that gets pulled within days never reaches us. Security
# updates don't wait.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # The workflows pin actions to a commit SHA with the release in a trailing
  # comment (`uses: actions/checkout@<sha> # v7.0.1`); Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
