# Revisión semanal de versiones: npm, acciones de GitHub e imagen base de Docker.
# Ver docs/dependencias.md para la política.
#
# Los saltos de versión mayor de Node (runtime, imagen y @types/node) NO los
# propone Dependabot: se deciden a mano siguiendo el calendario de LTS, porque
# las versiones impares de Node no tienen LTS y no se usan.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
